<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepTrust Academy — AI Verification & Digital Trust</title>
    <meta name="description" content="AI-powered platform for deepfake detection, digital trust verification, and identity protection." />
    <!-- Prevent theme flashing during page load -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('deeptrust_theme') || 'system';
          var isDark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
